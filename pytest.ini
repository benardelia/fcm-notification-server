[pytest]
DJANGO_SETTINGS_MODULE = fcm_server.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v --tb=short --cov=notification --cov-report=term-missing --cov-fail-under=80

[coverage:run]
source = notification
omit =
    */migrations/*
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
